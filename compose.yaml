services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: investing-bot:local
    ports:
      - "127.0.0.1:${INVESTING_BOT_HOST_PORT:-8000}:8000"
    volumes:
      - investing_bot_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  investing_bot_data:
    name: investing_bot_data
