[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investing-bot"
version = "0.1.0"
description = "A local, provider-neutral stock research and strategy backtesting application."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "curl_cffi==0.16.0",
    "duckdb>=1.5.4,<1.6",
    "fastapi>=0.139.2,<0.140",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6,<4",
    "pandas>=3.0.5,<3.1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "pytz>=2025.2,<2027",
    "uvicorn>=0.51,<0.52",
    "yfinance==1.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=8.3,<9",
]

[project.scripts]
investing-bot = "investing_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investing_bot = [
    "db/migrations/*.sql",
    "providers/fixtures/data/*.json",
    "services/data/*.json",
    "web/static/*.css",
    "web/templates/*.html",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
